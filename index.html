<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conway's Game of Chaos</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1>Conway's Game of Chaos</h1>
        <p class="lead">
          Two nearly identical worlds evolve side by side so their chaotic
          divergence is easy to compare.
        </p>

        <p class="repo-link">
          <a href="https://github.com/ercasta/cgc" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub">
            <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
                -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
                .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
                .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
                0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
            </svg>
            <span>View on GitHub</span>
          </a>
        </p>
        <p class="author">Author: <a href="https://github.com/ercasta" target="_blank" rel="noopener noreferrer">ercasta</a></p>

        <form id="controls">
          <label>
            Seed
            <input name="seed" type="text" value="42" />
          </label>
          <label>
            Grid size
            <input name="size" type="number" min="12" max="80" step="1" value="36" />
          </label>
          <label>
            Initial live density
            <input name="seedDensity" type="range" min="0.05" max="0.55" step="0.01" value="0.26" />
          </label>
          <label>
            Initial strength
            <input name="baseStrength" type="range" min="0.2" max="1" step="0.01" value="0.82" />
          </label>
          <label>
            Aging speed
            <input name="agingSpeed" type="range" min="0.01" max="0.25" step="0.01" value="0.08" />
          </label>
          <label>
            Offspring inheritance
            <input name="inheritance" type="range" min="0.4" max="1" step="0.01" value="0.92" />
          </label>
          <label>
            Initial perturbation
            <input name="perturbation" type="range" min="0.01" max="0.35" step="0.01" value="0.08" />
          </label>
          <label>
            Step delay (ms)
            <input name="speedMs" type="number" min="40" max="4000" step="10" value="180" />
          </label>

          <div class="actions">
            <button id="play" type="button">Run</button>
            <button id="step" type="button">Step</button>
            <button id="reset" type="button">Reset</button>
            <button id="randomize-seed" type="button">Randomize seed</button>
          </div>
        </form>
      </aside>

      <main class="content">
        <header class="summary">
          <strong id="global-metrics"></strong>
        </header>
        <section class="grids">
          <article class="panel">
            <h2>Reference scenario</h2>
            <p id="metrics-left" class="metrics"></p>
            <canvas id="grid-left" width="540" height="540" aria-label="Reference scenario grid"></canvas>
          </article>
          <article class="panel">
            <h2>Perturbed scenario</h2>
            <p id="metrics-right" class="metrics"></p>
            <canvas id="grid-right" width="540" height="540" aria-label="Perturbed scenario grid"></canvas>
          </article>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
